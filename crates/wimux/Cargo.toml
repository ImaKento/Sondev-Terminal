[package]
name = "wimux"
edition.workspace = true
version.workspace = true
license.workspace = true

# 実行ファイル名（インストーラーで配る名前）
[[bin]]
name = "sondev"
path = "src/main.rs"

[dependencies]
gpui-kit = "0.8.1"
alacritty_terminal = "0.26.0"
portable-pty = "0.9.0"
anyhow = "1"
log = "0.4"
env_logger = "0.11"
flume = "0.11"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wry = "0.57"

# Windows の API（Windows 以外でも型チェックできるよう、全プラットフォームで依存に入れている）
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
# exe にアイコンとバージョン情報を埋め込む（Windows 向けビルドのときだけ使う）
winresource = "0.1"

[lints.rust]
# `RUSTFLAGS="--cfg wimux_check" cargo check` で、Windows 専用コードを Linux でも型チェックできる
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(wimux_check)'] }
